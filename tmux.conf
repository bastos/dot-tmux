# ===============================================
# TMUX CONFIGURATION
# ===============================================

# ===============================================
# GENERAL SETTINGS
# ===============================================

# Set true color support with cross-platform terminal overrides
set-option -sa terminal-overrides ",xterm*:Tc,xterm-ghostty:Tc,alacritty:RGB,*256col*:RGB"
set-option -ga terminal-overrides ",xterm-ghostty:RGB,alacritty:RGB"

# Enable mouse support
set -g mouse on

# Set default terminal (cross-platform compatible)
if-shell 'test "$TERM_PROGRAM" = "ghostty"' {
    set -g default-terminal "xterm-ghostty"
} {
    set -g default-terminal "tmux-256color"
}

# Platform-specific clipboard and shell settings
if-shell 'uname | grep -q Darwin' {
    # macOS specific settings
    set-option -g default-command "reattach-to-user-namespace -l $SHELL"
    set -g set-clipboard on
} {
    # Linux specific settings
    set -g set-clipboard external
}

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Terminal optimizations
set -g escape-time 0
set -g repeat-time 600
set -g allow-passthrough on

# ===============================================
# KEY BINDINGS
# ===============================================

# Primary prefix: Ctrl-Space, secondary: Ctrl-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
unbind C-a

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Switch windows with Shift-arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Copy mode improvements (cross-platform)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Platform-specific copy commands
if-shell 'uname | grep -q Darwin' {
    # macOS clipboard integration
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    # Linux clipboard integration (works with X11 and Wayland)
    if-shell 'command -v xclip' {
        bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    } {
        if-shell 'command -v wl-copy' {
            bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
            bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
        }
    }
}

# Clear screen and history
bind-key -n C-k send-keys C-l \; run-shell "sleep 0.1" \; clear-history

# ===============================================
# GHOSTTY-INSPIRED THEME
# ===============================================

# Ghostty color palette
# Background: #1a1a1a (dark gray)
# Foreground: #e6e6e6 (light gray)
# Accent: #7aa2f7 (blue)
# Secondary: #9d7cd8 (purple)
# Success: #9ece6a (green)
# Warning: #e0af68 (yellow)
# Error: #f7768e (red)

# Status bar - Ghostty inspired dark theme
set -g status-style bg='#1a1a1a',fg='#e6e6e6'
set -g status-left-length 30
set -g status-right-length 150

# Window status colors
setw -g window-status-style fg='#565f89',bg='#1a1a1a'
setw -g window-status-current-style fg='#7aa2f7',bg='#1a1a1a',bold

# Pane border colors - subtle but visible
set -g pane-border-style fg='#414868'
set -g pane-active-border-style fg='#7aa2f7'

# Message colors
set -g message-style fg='#7aa2f7',bg='#1a1a1a',bold
set -g message-command-style fg='#e0af68',bg='#1a1a1a',bold

# Copy mode colors
setw -g mode-style fg='#1a1a1a',bg='#7aa2f7'

# Clock mode color
setw -g clock-mode-colour '#7aa2f7'

# Status bar content with Ghostty-inspired styling
set -g status-left "#[fg=#7aa2f7,bold]❯ #[fg=#e6e6e6]#S #[fg=#565f89]│ "
set -g status-right "#{prefix_highlight}#[fg=#565f89]%Y-%m-%d #[fg=#7aa2f7,bold]%H:%M #[fg=#9ece6a]#{?client_prefix,⬢,○}"

# Window status format with modern styling
setw -g window-status-format "#[fg=#565f89] #I #[fg=#565f89]#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I #[fg=#e6e6e6,bold]#W#{?window_zoomed_flag, 🔍,} "

# Activity and bell styling
setw -g window-status-activity-style fg='#e0af68',bg='#1a1a1a'
setw -g window-status-bell-style fg='#f7768e',bg='#1a1a1a',bold

# ===============================================
# PLUGIN CONFIGURATION
# ===============================================

# Plugin settings for tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Plugin settings for tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugin settings for tmux-yank (cross-platform)
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-no-clear'
set -g @yank_with_mouse on
set -g @shell_mode 'vi'

# Platform-specific yank settings
if-shell 'uname | grep -q Darwin' {
    set -g @override_copy_command 'pbcopy'
} {
    if-shell 'command -v xclip' {
        set -g @override_copy_command 'xclip -in -selection clipboard'
    } {
        if-shell 'command -v wl-copy' {
            set -g @override_copy_command 'wl-copy'
        }
    }
}

# Plugin settings for tmux-prefix-highlight
set -g @prefix_highlight_fg '#1a1a1a'
set -g @prefix_highlight_bg '#7aa2f7'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#1a1a1a,bg=#9d7cd8,bold'
set -g @prefix_highlight_prefix_prompt '⌨'
set -g @prefix_highlight_copy_prompt '📋'

# Plugin settings for tmux-sidebar
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-position 'left'
set -g @sidebar-tree-width '30'

# Plugin settings for extrakto
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '15'
set -g @extrakto_grab_area 'full'

# Plugin tmux-command-pallet
set -g @cmdpalette-render-cmd 'bat -l md -f -pp'
set -g @cmdpalette-key-prefix 'prefix h'

# ===============================================
# TERMINAL-SPECIFIC OPTIMIZATIONS
# ===============================================

# Ghostty-specific optimizations
if-shell 'test "$TERM_PROGRAM" = "ghostty"' {
    # Set window title to show current directory and session
    set -g set-titles on
    set -g set-titles-string '#S: #W - #{pane_current_path}'

    # Optimize for Ghostty's rendering
    set -g visual-activity off
    set -g visual-bell off
    set -g visual-silence off

    # Better mouse integration for Ghostty
    set -g @scroll-speed-num-lines-per-scroll 3
}

# Alacritty optimizations
if-shell 'test "$TERM" = "alacritty"' {
    set -g set-titles on
    set -g set-titles-string '#S: #W'
}

# Additional Linux-specific optimizations
if-shell 'uname | grep -q Linux' {
    # Better integration with Linux desktop environments
    set -g set-titles on
    set -g set-titles-string 'tmux: #S - #W'

    # Optimize for common Linux terminals
    set -g terminal-overrides 'xterm*:smcup@:rmcup@'
}

# ===============================================
# PLUGIN LIST
# ===============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'lost-melody/tmux-command-palette'

# ===============================================
# INITIALIZE PLUGIN MANAGER
# ===============================================

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

